<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Árbol de Contenido</title>
<style>
  :root{
    --bg:#faf7f2;
    --ink:#2b2a26;
    --muted:#8a857c;
    --line:#d9d3c7;
    --card:#ffffff;
    --shadow:0 1px 2px rgba(43,42,38,.06),0 6px 18px rgba(43,42,38,.06);
    --p1:#7c9a92; --p1s:#e4ede9;
    --p2:#c98b6b; --p2s:#f3e3d9;
    --p3:#b06a7e; --p3s:#f0dfe4;
    --p4:#7a8db5; --p4s:#e2e7f1;
    --p5:#c7a24f; --p5s:#f3ecd8;
    --p6:#6f7d8c; --p6s:#e2e6ea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(circle at 20% 10%, #fdfbf7 0%, var(--bg) 55%);
    color:var(--ink);
    min-height:100vh;
    padding:48px 32px 120px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1400px;margin:0 auto}

  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:8px}
  .title-block{display:flex;align-items:center;gap:14px}
  .title-block .leaf{font-size:38px;line-height:1}
  h1{
    font-family:Georgia,'Times New Roman',serif;
    font-size:44px;font-weight:600;letter-spacing:-.5px;
  }
  .subtitle{color:var(--muted);font-size:15px;margin:6px 0 0 52px;max-width:560px;line-height:1.5}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap}
  button.tool{
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:9px 15px;border-radius:10px;font-size:13.5px;cursor:pointer;
    font-weight:500;transition:.15s;box-shadow:var(--shadow)
  }
  button.tool:hover{transform:translateY(-1px);border-color:#c3bcae}
  button.tool.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .savehint{font-size:12.5px;color:var(--muted);align-self:center}

  .board{
    margin-top:40px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:28px;
  }

  .pillar{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:var(--shadow);
    overflow:hidden;
    display:flex;flex-direction:column;
  }
  .pillar-head{
    padding:20px 20px 18px;
    color:#fff;
    position:relative;
  }
  .pnum{
    font-size:12px;letter-spacing:2px;text-transform:uppercase;
    opacity:.85;font-weight:600;
  }
  .ptitle{
    font-family:Georgia,serif;font-size:22px;font-weight:600;line-height:1.2;
    margin-top:4px;outline:none;
  }
  .ptitle:focus{background:rgba(255,255,255,.18);border-radius:6px}
  .pillar-body{padding:14px 16px 8px;flex:1;display:flex;flex-direction:column;gap:8px}

  .node{
    display:flex;align-items:center;gap:8px;
    border:1px solid var(--line);border-radius:11px;
    padding:10px 10px 10px 14px;
    background:#fff;
    position:relative;
  }
  .node .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .node .txt{
    flex:1;font-size:14.5px;line-height:1.35;outline:none;
    padding:2px 2px;border-radius:5px;min-height:20px;
  }
  .node .txt:empty:before{content:'Escribe aquí…';color:var(--muted)}
  .node .txt:focus{background:#faf7f2}
  .node .del{
    border:none;background:none;color:var(--muted);cursor:pointer;
    font-size:16px;line-height:1;padding:2px 4px;border-radius:6px;
    opacity:0;transition:.15s;flex:0 0 auto
  }
  .node:hover .del{opacity:1}
  .node .del:hover{color:#c0392b;background:#f7ecec}

  .add{
    border:1px dashed var(--line);background:transparent;color:var(--muted);
    border-radius:11px;padding:9px;font-size:13.5px;cursor:pointer;
    margin:2px 0 12px;transition:.15s;font-weight:500
  }
  .add:hover{border-color:#b9b2a4;color:var(--ink);background:#fbfaf6}

  footer{margin-top:56px;text-align:center;color:var(--muted);font-size:12.5px}

  @media (max-width:640px){
    body{padding:28px 16px 100px}
    h1{font-size:32px}
    .subtitle{margin-left:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="title-block">
        <span class="leaf">🌳</span>
        <h1 contenteditable="true" id="mainTitle" spellcheck="false">Árbol de Contenido</h1>
      </div>
      <p class="subtitle">Tu mapa de temas por pilar. Haz clic en cualquier texto para editarlo, agrega o borra temas, y guarda cuando quieras.</p>
    </div>
    <div class="toolbar">
      <button class="tool" onclick="addPillar()">+ Pilar</button>
      <button class="tool" onclick="exportJSON()">Exportar</button>
      <button class="tool" onclick="importJSON()">Importar</button>
      <button class="tool primary" onclick="save()">Guardar</button>
      <span class="savehint" id="savehint"></span>
    </div>
  </header>

  <div class="board" id="board"></div>

  <footer>Se guarda en este archivo con “Exportar”. También queda guardado en tu navegador al pulsar “Guardar”.</footer>
</div>

<input type="file" id="fileInput" accept="application/json" style="display:none">

<script>
const PALETTE = ['p1','p2','p3','p4','p5','p6','p1','p2','p3'];

const DEFAULT = [
  {title:"Entender lo que le pasa a tu hijo", items:[
    "Señales antes de una explosión",
    "Qué hay detrás de ciertas conductas",
    "Diferenciar necesidad / conducta / contexto",
    "Leer el entorno"]},
  {title:"Regulación y respuesta de la madre", items:[
    "Qué hacer cuando tú estás llegando al límite",
    "Gritos",
    "Corregulación",
    "Regulación emocional",
    "Qué hacer en el momento"]},
  {title:"Límites y conducta", items:[
    "Límites","Rabietas","Resistencia","Repetir instrucciones",
    "Negociaciones","Pantallas y transiciones"]},
  {title:"Entorno", items:[
    "Rutinas","Sueño","Pantallas","Alimentación","Estímulos",
    "Transiciones","Organización del ambiente"]},
  {title:"Relación y crianza consciente", items:[
    "Conexión","Reparación","Vínculo","Patrones familiares",
    "Reparenting / historia de la madre",
    "Acompañar sin castigar ni sobreproteger"]},
  {title:"Tu método (transversal)", items:[
    "Casos","Aplicaciones","Cómo analizar una situación",
    "Errores comunes","Antes / después",
    "Tu forma particular de interpretar la conducta"]}
];

const STORAGE_KEY = 'arbolContenido';

// ---- Guardado en la nube (JSONBin) ----
const CLOUD = {
  binId: '6a7f5aecda38895dfee5a263',
  apiKey: '$2a$10$UmnJtUvMLYhulGUe2bVNXuC0WHNwN7SY1.M6j4s5WbPhJxWiixhgW',
  url(){ return 'https://api.jsonbin.io/v3/b/' + this.binId; }
};

let data = loadLocal(); // arranca con lo local mientras llega la nube

function loadLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {title:"Árbol de Contenido", pillars:JSON.parse(JSON.stringify(DEFAULT))};
}

async function loadCloud(){
  const h=document.getElementById('savehint');
  h.textContent='Cargando desde la nube…';
  try{
    const res = await fetch(CLOUD.url()+'/latest',{
      headers:{'X-Access-Key':CLOUD.apiKey}
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    const record = json.record;
    // Solo usar la nube si trae un árbol con contenido real
    if(record && Array.isArray(record.pillars) && record.pillars.length){
      data = record;
      render();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }
    h.textContent='';
  }catch(err){
    h.textContent='⚠ No se pudo cargar la nube (uso versión local)';
    setTimeout(()=>h.textContent='',4000);
  }
}

function render(){
  document.getElementById('mainTitle').textContent = data.title;
  const board = document.getElementById('board');
  board.innerHTML='';
  data.pillars.forEach((p,pi)=>{
    const c = PALETTE[pi % PALETTE.length];
    const card = document.createElement('div');
    card.className='pillar';
    card.innerHTML = `
      <div class="pillar-head" style="background:var(--${c})">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div style="flex:1">
            <div class="pnum">Pilar ${pi+1}</div>
            <div class="ptitle" contenteditable="true" spellcheck="false"
                 oninput="data.pillars[${pi}].title=this.textContent"></div>
          </div>
          <button class="del" style="color:#fff;opacity:.75" title="Eliminar pilar"
                  onclick="removePillar(${pi})">✕</button>
        </div>
      </div>
      <div class="pillar-body" id="body-${pi}"></div>
      <button class="add" onclick="addItem(${pi})">+ Agregar tema</button>
    `;
    board.appendChild(card);
    card.querySelector('.ptitle').textContent = p.title;

    const body = card.querySelector(`#body-${pi}`);
    p.items.forEach((it,ii)=>{
      const node = document.createElement('div');
      node.className='node';
      node.innerHTML = `
        <span class="dot" style="background:var(--${c})"></span>
        <div class="txt" contenteditable="true" spellcheck="false"
             oninput="data.pillars[${pi}].items[${ii}]=this.textContent"></div>
        <button class="del" title="Eliminar tema" onclick="removeItem(${pi},${ii})">✕</button>
      `;
      node.querySelector('.txt').textContent = it;
      body.appendChild(node);
    });
  });
}

function addItem(pi){ data.pillars[pi].items.push(''); render(); focusLast(pi); }
function removeItem(pi,ii){ data.pillars[pi].items.splice(ii,1); render(); }
function addPillar(){ data.pillars.push({title:'Nuevo pilar', items:['']}); render(); }
function removePillar(pi){
  if(confirm('¿Eliminar este pilar completo?')){ data.pillars.splice(pi,1); render(); }
}
function focusLast(pi){
  const body=document.getElementById('body-'+pi);
  const txts=body.querySelectorAll('.txt');
  if(txts.length) txts[txts.length-1].focus();
}

document.getElementById('mainTitle').addEventListener('input',e=>{
  data.title=e.target.textContent;
});

async function save(){
  const h=document.getElementById('savehint');
  // respaldo local siempre
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  h.textContent='Guardando en la nube…';
  try{
    const res = await fetch(CLOUD.url(),{
      method:'PUT',
      headers:{
        'Content-Type':'application/json',
        'X-Access-Key':CLOUD.apiKey
      },
      body:JSON.stringify(data)
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    h.textContent='✓ Guardado en la nube '+new Date().toLocaleTimeString();
    setTimeout(()=>h.textContent='',3000);
  }catch(err){
    h.textContent='⚠ Guardado local OK, pero falló la nube';
    setTimeout(()=>h.textContent='',5000);
  }
}

function exportJSON(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='arbol-contenido.json';
  a.click();
}

function importJSON(){ document.getElementById('fileInput').click(); }
document.getElementById('fileInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ data=JSON.parse(r.result); render(); save(); }catch(err){ alert('Archivo no válido'); } };
  r.readAsText(f);
});

render();
loadCloud();
</script>
</body>
</html>
